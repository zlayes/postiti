<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Post-its</title>
<style>
  :root{
    --desk:#3a4048; --desk2:#2e343b; --ink:#1f2328; --paper:#fff7c2;
    --bar:#22262b; --bar-ink:#e8e6df; --muted:#9aa0a6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--desk);color:var(--ink)}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* Barre du haut */
  #bar{position:fixed;inset:0 0 auto 0;height:56px;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:50;overflow-x:auto;white-space:nowrap}
  #bar::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:#33383f;color:var(--bar-ink);font-size:14px;flex:0 0 auto}
  .chip .sw{width:12px;height:12px;border-radius:50%}
  .chip.on{background:var(--bar-ink);color:var(--bar)}
  .chip.on .cnt,.chip .cnt{opacity:.7;font-size:12px}
  .sep{width:1px;height:28px;background:#444a52;flex:0 0 auto;margin:0 4px}
  #add{background:var(--paper);color:var(--ink);font-weight:600}

  /* Bureau : #desk = fenetre fixe, #canvas = grande surface deplacable/zoomable */
  #desk{position:absolute;inset:56px 0 0 0;overflow:hidden;touch-action:none;cursor:grab;
    background:radial-gradient(circle at 50% 0,#454b54 0,transparent 60%),var(--desk2)}
  #desk.grabbing{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;width:3000px;height:2000px;transform-origin:0 0;
    background:
      repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.04) 39px 40px),
      repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.04) 39px 40px),
      var(--desk);
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.35)}
  #empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:18px;pointer-events:none;text-align:center;padding:24px}

  /* Post-it */
  .note{position:absolute;width:240px;min-height:200px;background:var(--c,var(--paper));border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;
    transform:rotate(var(--r,0deg));user-select:none}
  .note.drag{box-shadow:0 4px 6px rgba(0,0,0,.3),0 26px 40px rgba(0,0,0,.45);transform:rotate(0deg) scale(1.03);z-index:40!important;transition:none}
  .note.hide{display:none}
  .note .head{height:34px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;cursor:grab;background:rgba(0,0,0,.06);border-radius:2px 2px 0 0}
  .note .theme{font-size:12px;font-weight:600;letter-spacing:.2px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
  .note .prio{display:flex;gap:3px;padding:6px}
  .note .prio i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.15)}
  .note .prio i.on{background:#c0392b}
  .note .head button{width:30px;height:30px;border-radius:6px;font-size:16px;opacity:.7}
  .note .head button:active{background:rgba(0,0,0,.1)}
  .note textarea{flex:1;resize:none;border:0;background:transparent;font:inherit;font-size:17px;line-height:1.35;padding:10px 12px 12px;color:var(--ink);outline:none;min-height:150px;user-select:text}
  .note textarea::placeholder{color:rgba(0,0,0,.35)}
  .note .foot{display:flex;justify-content:space-between;padding:0 6px 6px}
  .note .foot button{height:34px;padding:0 10px;border-radius:6px;font-size:14px;opacity:.75}
  .note .foot .done{font-weight:600;opacity:1}
  .note .foot button:active{background:rgba(0,0,0,.1)}
  /* Compte a rebours */
  .note .due{display:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;
    background:rgba(0,0,0,.12);flex:0 0 auto;letter-spacing:.3px}
  .note .due.on{display:inline-block}
  .note .due.soon{background:#e8890c;color:#fff}
  .note .due.late{background:#c0392b;color:#fff}

  /* Pile des taches closes, a droite */
  #rail{position:fixed;right:8px;top:64px;bottom:64px;width:190px;z-index:44;display:none;
    flex-direction:column;background:rgba(20,23,27,.82);border-radius:12px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #rail.on{display:flex}
  #rail .top{display:flex;align-items:center;gap:6px;padding:9px 11px;color:var(--bar-ink);
    font-size:12px;letter-spacing:.3px;border-bottom:1px solid rgba(255,255,255,.08);flex:0 0 auto}
  #rail .top .n{margin-left:auto;opacity:.6}
  #railList{overflow-y:auto;padding:6px}
  #railList .empty{color:var(--muted);font-size:12px;padding:10px;text-align:center}
  .grp{margin-bottom:6px}
  .grp .gh{display:flex;align-items:center;gap:7px;width:100%;padding:8px 9px;border-radius:8px;
    background:rgba(255,255,255,.06);color:var(--bar-ink);font-size:13px;text-align:left}
  .grp .gh .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .grp .gh .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp .gh .gc{opacity:.6;font-size:12px}
  .grp .gh .ar{opacity:.6;transition:transform .25s ease;font-size:11px}
  .grp.open .gh .ar{transform:rotate(180deg)}
  .grp .gb{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .grp.open .gb{max-height:52vh;overflow-y:auto}
  .grp .it{display:flex;align-items:flex-start;gap:6px;padding:7px 8px;margin:4px 0 0;
    border-radius:8px;background:rgba(255,255,255,.04);color:var(--bar-ink);font-size:12px}
  .grp .it .tx{flex:1;line-height:1.3;word-break:break-word;opacity:.85}
  .grp .it .dt{display:block;font-size:10px;opacity:.5;margin-top:3px}
  .grp .it button{width:24px;height:24px;border-radius:6px;font-size:12px;opacity:.6;flex:0 0 auto}
  .grp .it button:active{background:rgba(255,255,255,.12)}

  /* Zoom */
  #zoomBox{position:fixed;right:8px;bottom:12px;z-index:44;display:flex;gap:1px;
    background:rgba(20,23,27,.82);border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #zoomBox button{height:38px;min-width:44px;color:var(--bar-ink);font-size:16px}
  #zoomBox button:active{background:rgba(255,255,255,.12)}
  #zoomPct{font-size:12px!important;min-width:56px!important;opacity:.75}
  @media (max-width:640px){
    #rail{width:150px}
    #zoomBox button{min-width:38px}
  }


  /* Compagnon */
  #buddy{position:absolute;bottom:8px;left:24px;width:110px;height:110px;z-index:45;cursor:pointer;touch-action:none;transition:left 6s ease-in-out}
  #buddy svg{width:100%;height:100%;overflow:visible}
  #buddy .tent{transform-origin:50% 0;animation:wave 2.4s ease-in-out infinite}
  #buddy .tent:nth-child(2){animation-delay:.3s}#buddy .tent:nth-child(3){animation-delay:.6s}#buddy .tent:nth-child(4){animation-delay:.9s}#buddy .tent:nth-child(5){animation-delay:1.2s}
  #buddy .body{animation:bob 3s ease-in-out infinite;transform-origin:50% 60%}
  #buddy.sleep .tent{animation-duration:6s}#buddy.sleep .body{animation-duration:6s}
  #buddy.happy .body{animation:jump .6s ease-out 3}
  #buddy .lid{transform-origin:center;transition:transform .12s}
  #buddy.blink .lid,#buddy.sleep .lid{transform:scaleY(.08)}
  #buddy .bubble{position:absolute;left:100px;top:-8px;background:#fff;color:var(--ink);padding:6px 10px;border-radius:12px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #buddy .bubble.on{opacity:1}
  #buddy .zz{position:absolute;left:70px;top:0;color:#dfe3ea;font-size:16px;opacity:0}
  #buddy.sleep .zz{animation:zz 2.5s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-28px) scale(1.05)}100%{transform:translateY(0)}}
  @keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-22px)}}
  @media (prefers-reduced-motion:reduce){#buddy *{animation:none!important}}

  /* Panneaux */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .panel{background:#f7f5ee;color:var(--ink);width:min(720px,100%);max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
  .panel h2{margin:0 0 12px;font-size:18px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e2dfd5}
  .row .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
  .row .name{flex:1;font-size:16px}
  .row button{height:36px;padding:0 12px;border-radius:8px;background:#e9e6dc}
  .row input[type=text]{flex:1;height:40px;font:inherit;font-size:16px;padding:0 10px;border:1px solid #cfcbc0;border-radius:8px;background:#fff}
  .row input[type=color]{width:44px;height:40px;border:0;background:none;padding:0}
  .primary{background:var(--ink)!important;color:#fff}
  .arch{font-size:15px}
  .arch .txt{flex:1;white-space:pre-wrap}
  .arch .meta{font-size:12px;color:#777}
  .close{width:100%;height:44px;margin-top:12px;border-radius:10px;background:#e9e6dc;font-size:16px}
  .opt{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
  .opt button{height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;font-size:15px}
  .opt button.on{outline:2px solid var(--ink)}

  /* Mur de connexion */
  #gate{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:24px;
    background:radial-gradient(circle at 50% 15%,#4a505a 0,var(--desk2) 70%)}
  #gate.on{display:grid}
  #gate .card{background:#f7f5ee;color:var(--ink);width:min(380px,100%);border-radius:16px;padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.45)}
  #gate h1{margin:0 0 4px;font-size:22px}
  #gate .sub{margin:0 0 6px;color:#777;font-size:14px;line-height:1.4}
  #gate label{display:block;font-size:13px;color:#777;margin:14px 0 4px}
  #gate input{width:100%;height:46px;font:inherit;font-size:16px;padding:0 12px;
    border:1px solid #cfcbc0;border-radius:10px;background:#fff}
  #gate .acts{display:flex;gap:8px;margin-top:18px}
  #gate .acts button{flex:1;height:46px;border-radius:10px;font-size:15px;background:#e9e6dc}
  #gate .acts .primary{background:var(--ink);color:#fff;font-weight:600}
  #gate .msg{margin-top:14px;font-size:14px;min-height:20px;line-height:1.4}
  #gate .msg.err{color:#c0392b}
  #gate .msg.ok{color:#2e7d32}
  #gate .busy{opacity:.55;pointer-events:none}

  /* Indicateur de sauvegarde */
  #sync{flex:0 0 auto;font-size:12px;color:#e6b800;display:none}
  #sync.on{display:inline}
</style>
</head>
<body>

<!-- Mur de connexion -->
<div id="gate" class="on"><div class="card" id="gCard">
  <h1>Post-its</h1>
  <p class="sub">Connecte-toi pour retrouver ton bureau sur tous tes appareils.</p>
  <label for="gMail">Email</label>
  <input id="gMail" type="email" autocomplete="email" inputmode="email" placeholder="toi@exemple.fr">
  <label for="gPass">Mot de passe</label>
  <input id="gPass" type="password" autocomplete="current-password" placeholder="6 caractères minimum">
  <div class="acts">
    <button class="primary" id="gIn">Se connecter</button>
    <button id="gUp">Créer un compte</button>
  </div>
  <div class="msg" id="gMsg"></div>
</div></div>

<div id="bar">
  <button id="add" class="chip">+ Post-it</button>
  <span id="sync"></span>
  <div class="sep"></div>
  <div id="filters" style="display:contents"></div>
  <div class="sep"></div>
  <button id="hideNone" class="chip">Masquer sans thème</button>
  <button id="themesBtn" class="chip">Thèmes</button>
  <button id="profBtn" class="chip">👤 <span id="profName"></span></button>
</div>

<div id="desk"><div id="canvas"></div><div id="buddy" title="Poulpo">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(0,52)">
      <path class="tent" d="M22 0c-2 14-14 20-10 34" stroke="#7c4dbb" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="tent" d="M36 4c-1 14-8 22-4 34" stroke="#8c5fd0" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="tent" d="M50 6c0 14-2 22 0 36" stroke="#7c4dbb" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="tent" d="M64 4c1 14 8 22 4 34" stroke="#8c5fd0" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="tent" d="M78 0c2 14 14 20 10 34" stroke="#7c4dbb" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
    <g class="body">
      <ellipse cx="50" cy="36" rx="34" ry="30" fill="#9b6ee0"/>
      <ellipse cx="38" cy="18" rx="10" ry="6" fill="#b58cf0" opacity=".6"/>
      <g class="eye"><circle cx="38" cy="38" r="9" fill="#fff"/><circle class="pupil" cx="40" cy="39" r="4" fill="#1f2328"/><rect class="lid" x="29" y="29" width="18" height="18" rx="9" fill="#9b6ee0"/></g>
      <g class="eye"><circle cx="62" cy="38" r="9" fill="#fff"/><circle class="pupil" cx="64" cy="39" r="4" fill="#1f2328"/><rect class="lid" x="53" y="29" width="18" height="18" rx="9" fill="#9b6ee0"/></g>
      <path class="mouth" d="M43 52q7 5 14 0" stroke="#4a2a80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="48" r="4" fill="#e0a1c8" opacity=".6"/><circle cx="70" cy="48" r="4" fill="#e0a1c8" opacity=".6"/>
    </g>
  </svg>
  <div class="bubble"></div><div class="zz">z z</div>
</div>
<div id="empty">Aucun post-it ici.<br>Touche « + Post-it » pour commencer.</div></div>

<!-- Pile des tâches closes -->
<div id="rail">
  <div class="top">TERMINÉ <span class="n" id="railCnt">0</span></div>
  <div id="railList"></div>
</div>

<!-- Zoom -->
<div id="zoomBox">
  <button id="zoomOut" title="Dézoomer">−</button>
  <button id="zoomPct" title="Revenir à 100 % et recentrer">100%</button>
  <button id="zoomIn" title="Zoomer">+</button>
</div>

<!-- Choix thème / priorité d'une note -->
<div class="sheet" id="noteSheet"><div class="panel">
  <h2>Thème</h2><div class="opt" id="optTheme"></div>
  <h2 style="margin-top:16px">Priorité</h2><div class="opt" id="optPrio"></div>
  <h2 style="margin-top:16px">Deadline</h2>
  <div class="opt" id="optDue"></div>
  <div class="row"><input type="date" id="dueDate" style="flex:1;height:40px;font:inherit;font-size:16px;padding:0 10px;border:1px solid #cfcbc0;border-radius:8px;background:#fff"><button id="dueClear">Aucune</button></div>
  <button class="close" data-close>Fermer</button>
</div></div>

<!-- Gestion des thèmes -->
<div class="sheet" id="themeSheet"><div class="panel">
  <h2>Thèmes</h2>
  <div id="themeList"></div>
  <div class="row"><input type="color" id="newColor" value="#ffd166"><input type="text" id="newName" placeholder="Nouveau thème"><button class="primary" id="newTheme">Ajouter</button></div>
  <button class="close" data-close>Fermer</button>
</div></div>

<!-- Profils -->
<div class="sheet" id="profSheet"><div class="panel">
  <h2>Profils</h2>
  <div id="profList"></div>
  <div class="row"><input type="text" id="newProf" placeholder="Prénom"><button class="primary" id="addProf">Créer</button></div>
  <div class="row"><span class="name" style="font-size:14px;color:#777">Compte : <span id="acctMail"></span></span><button id="logout">Déconnexion</button></div>
  <button class="close" data-close>Fermer</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
/* ---------- Supabase : compte + boards ---------- */
if(!window.supabase){
  const m=document.getElementById('gMsg');
  m.className='msg err';
  m.textContent="Librairie de connexion non chargée. Vérifie ta connexion internet, puis recharge la page.";
  throw new Error('supabase-js absent');
}
const SB_URL='https://bggnzivpockfowprnwoa.supabase.co';
const SB_KEY='sb_publishable_dnybm_QvXyOrayd0kG-MuA_1m4GAphw';
const db=window.supabase.createClient(SB_URL,SB_KEY);

const LASTKEY='postits-last-profile';  // préférence locale : profil ouvert sur cet appareil
let user=null;                         // utilisateur connecté
let boards=[];                         // [{id,name,state}] rapatriés depuis la base
let boardId=null;                      // board affiché
let profiles={list:[],current:''};     // vue dérivée, utilisée par le reste de l'app

function syncProfiles(){ profiles.list=boards.map(b=>b.name); }

/* Anciens post-its restés en localStorage : récupérés au premier login */
function localBoards(){
  const out=[];
  try{
    const p=JSON.parse(localStorage.getItem('postits-profiles')||'null');
    (p&&Array.isArray(p.list)?p.list:[]).forEach(n=>{
      try{ const s=JSON.parse(localStorage.getItem('postits-v1:'+n)||'null');
           if(s&&Array.isArray(s.notes)) out.push({name:n,state:s}); }catch(e){}
    });
  }catch(e){}
  return out;
}

async function fetchBoards(){
  const {data,error}=await db.from('boards').select('id,name,state').order('created_at');
  if(error) throw error;
  boards=data||[]; syncProfiles(); return boards;
}
async function createBoard(name,st){
  const {data,error}=await db.from('boards')
    .insert({user_id:user.id,name,state:st||freshState()})
    .select('id,name,state').single();
  if(error) throw error;
  boards.push(data); syncProfiles(); return data;
}

/* Sauvegarde : même signature qu'avant, mais vers la base */
let saveT,pending=false;
function save(){ clearTimeout(saveT); saveT=setTimeout(pushState,400); }
async function pushState(){
  if(!user||!boardId) return;
  const b=boards.find(x=>x.id===boardId); if(b) b.state=state;
  const {error}=await db.from('boards').update({state}).eq('id',boardId);
  pending=!!error; setSync(error);
}
setInterval(()=>{ if(pending) pushState(); },8000);   // reprise après coupure réseau
function setSync(err){
  const el=document.getElementById('sync');
  el.classList.toggle('on',!!err);
  el.textContent=err?'⚠ non sauvegardé':'';
}

/* ---------- État ---------- */
const freshState=()=>({
  themes:[
    {id:'t1',name:'Valeo',color:'#ffd166'},
    {id:'t2',name:'Pixelgate',color:'#8ecae6'},
    {id:'t3',name:'Perso',color:'#b5e48c'},
  ],
  notes:[],      // {id,text,theme,prio,x,y,z,r,done,doneAt}
  filter:'all',  // 'all' | themeId | 'none'
  hideNone:false,
  z:1
});
let state=freshState();
const uid=()=>Math.random().toString(36).slice(2,9);
const themeOf=id=>state.themes.find(t=>t.id===id);
const colorOf=n=>themeOf(n.theme)?.color||'#fff7c2';

/* Deadline : n.due vaut 'AAAA-MM-JJ' ou rien. L'echeance tombe en fin de journee. */
const isoIn=days=>{const d=new Date();d.setDate(d.getDate()+days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function dueInfo(n){
  if(!n.due) return null;
  const [y,m,d]=n.due.split('-').map(Number); if(!y) return null;
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((new Date(y,m-1,d)-today)/86400000);
  if(days<0) return {txt:'En retard',cls:'late'};
  if(days===0){
    const h=Math.max(0,Math.ceil((new Date(y,m-1,d,23,59,59)-now)/3600000));
    return {txt:'H-'+h,cls:'soon'};
  }
  if(days===1) return {txt:'J-1',cls:'soon'};
  return {txt:'J-'+days,cls:''};
}

/* ---------- Rendu ---------- */
const desk=document.getElementById('desk'), canvas=document.getElementById('canvas'),
      empty=document.getElementById('empty');
const noteEls=new Map();

function visible(n){
  if(n.done) return false;
  if(state.filter!=='all'){
    if(state.filter==='none') return !n.theme;
    return n.theme===state.filter;
  }
  if(state.hideNone && !n.theme) return false;
  return true;
}

function renderBar(){
  const f=document.getElementById('filters'); f.innerHTML='';
  const active=state.notes.filter(n=>!n.done);
  const mk=(id,label,color)=>{

/* ---------- Drag tactile ---------- */
function makeDraggable(el,n){
  const head=el.querySelector('.head');
  let sx,sy,ox,oy,moved;
  head.addEventListener('pointerdown',e=>{
    if(e.target.tagName==='BUTTON') return;
    head.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;moved=false;
    n.z=++state.z; el.style.zIndex=n.z; el.classList.add('drag');
  });
  head.addEventListener('pointermove',e=>{
    if(!head.hasPointerCapture(e.pointerId)) return;
    const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    n.x=Math.max(0,Math.min(CW-el.offsetWidth,ox+dx/view.k));
    n.y=Math.max(0,Math.min(CH-el.offsetHeight,oy+dy/view.k));
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
  });
  const up=e=>{ if(!head.hasPointerCapture(e.pointerId)) return; head.releasePointerCapture(e.pointerId); el.classList.remove('drag'); save(); };
  head.addEventListener('pointerup',up); head.addEventListener('pointercancel',up);
}

/* ---------- Vue : deplacement au doigt + pincer pour zoomer ---------- */
const CW=3000, CH=2000, MINK=.4, MAXK=1.8;
let view={x:0,y:0,k:1};

function clampView(){
  const vw=desk.clientWidth, vh=desk.clientHeight, cw=CW*view.k, ch=CH*view.k;
  view.x = cw<=vw ? (vw-cw)/2 : Math.min(0,Math.max(vw-cw,view.x));
  view.y = ch<=vh ? (vh-ch)/2 : Math.min(0,Math.max(vh-ch,view.y));
}
function applyView(persist){
  clampView();
  canvas.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  document.getElementById('zoomPct').textContent=Math.round(view.k*100)+'%';
  if(persist!==false) saveView();
}
function saveView(){ try{ if(boardId) localStorage.setItem('postits-view:'+boardId,JSON.stringify(view)); }catch(e){} }
function loadView(){
  view={x:0,y:0,k:1};
  try{ const v=JSON.parse(localStorage.getItem('postits-view:'+boardId)||'null');
       if(v&&typeof v.k==='number') view={x:+v.x||0,y:+v.y||0,k:Math.max(MINK,Math.min(MAXK,v.k))}; }catch(e){}
  applyView(false);
}
const toWorld=(cx,cy)=>{const r=desk.getBoundingClientRect();
  return {x:(cx-r.left-view.x)/view.k, y:(cy-r.top-view.y)/view.k};};
function zoomAt(k2,cx,cy){
  const r=desk.getBoundingClientRect(), px=cx-r.left, py=cy-r.top;
  k2=Math.max(MINK,Math.min(MAXK,k2));
  view.x=px-(px-view.x)*(k2/view.k); view.y=py-(py-view.y)*(k2/view.k); view.k=k2;
  applyView();
}
/* recentrer : 100 % et on vise le milieu des post-its affiches */
function resetView(){
  const ns=state.notes.filter(visible);
  view.k=1;
  if(ns.length){
    const cx=ns.reduce((s,n)=>s+n.x+120,0)/ns.length, cy=ns.reduce((s,n)=>s+n.y+100,0)/ns.length;
    view.x=desk.clientWidth/2-cx; view.y=desk.clientHeight/2-cy;
  } else { view.x=desk.clientWidth/2-CW/2; view.y=desk.clientHeight/2-CH/2; }
  applyView();
}
document.getElementById('zoomIn').onclick=()=>zoomAt(view.k*1.25,desk.clientWidth/2,desk.clientHeight/2+56);
document.getElementById('zoomOut').onclick=()=>zoomAt(view.k/1.25,desk.clientWidth/2,desk.clientHeight/2+56);
document.getElementById('zoomPct').onclick=resetView;

const pts=new Map();
let panning=false, pan0=null, pinch0=null;
const pinchNow=()=>{const [a,b]=[...pts.values()];
  return {d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};};

desk.addEventListener('pointerdown',e=>{
  if(e.target.closest('.note')||e.target.closest('#buddy')) return;  // geres ailleurs
  desk.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ panning=true; desk.classList.add('grabbing');
    pan0={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; }
  else if(pts.size===2){ panning=false; const s=pinchNow();
    pinch0={...s,k:view.k,vx:view.x,vy:view.y}; }
});
desk.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size>=2&&pinch0){
    const s=pinchNow(), k2=Math.max(MINK,Math.min(MAXK,pinch0.k*(s.d/pinch0.d)));
    const r=desk.getBoundingClientRect(), px=pinch0.mx-r.left, py=pinch0.my-r.top;
    view.k=k2;
    view.x=px-(px-pinch0.vx)*(k2/pinch0.k)+(s.mx-pinch0.mx);
    view.y=py-(py-pinch0.vy)*(k2/pinch0.k)+(s.my-pinch0.my);
    applyView(false);
  } else if(panning&&pan0){
    view.x=pan0.vx+(e.clientX-pan0.x); view.y=pan0.vy+(e.clientY-pan0.y);
    applyView(false);
  }
});
const endPan=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch0=null;
  if(!pts.size){ panning=false; desk.classList.remove('grabbing'); saveView(); } };
desk.addEventListener('pointerup',endPan); desk.addEventListener('pointercancel',endPan);
desk.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey) zoomAt(view.k*(e.deltaY<0?1.12:.89),e.clientX,e.clientY);
  else { view.x-=e.deltaX; view.y-=e.deltaY; applyView(); }
},{passive:false});
window.addEventListener('resize',()=>applyView(false));

const railOpen=new Set();
function renderRail(){
  const rail=document.getElementById('rail'), l=document.getElementById('railList');

  rail.classList.toggle('on',done.length>0);
  document.getElementById('railCnt').textContent=done.length;
  l.innerHTML='';
  if(!done.length) return;
  const groups=[];
  state.themes.forEach(t=>{const ns=done.filter(n=>n.theme===t.id);
    if(ns.length) groups.push({key:t.id,name:t.name,color:t.color,notes:ns});});
  const sans=done.filter(n=>!themeOf(n.theme));
  if(sans.length) groups.push({key:'none',name:'Sans thème',color:'#fff7c2',notes:sans});

  groups.forEach(g=>{
    g.notes.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
    const box=document.createElement('div'); box.className='grp'+(railOpen.has(g.key)?' open':'');
    const gh=document.createElement('button'); gh.className='gh';
    gh.innerHTML=`<span class="sw" style="background:${g.color}"></span><span class="gn"></span><span class="gc">${g.notes.length}</span><span class="ar">▾</span>`;
    gh.querySelector('.gn').textContent=g.name;
    gh.onclick=()=>{ railOpen.has(g.key)?railOpen.delete(g.key):railOpen.add(g.key); renderRail(); };
    const gb=document.createElement('div'); gb.className='gb';
    g.notes.forEach(n=>{
      const it=document.createElement('div'); it.className='it';
      it.innerHTML=`<span class="tx"></span><button class="re" title="Remettre sur le bureau">↺</button><button class="rm" title="Supprimer">✕</button>`;
      const tx=it.querySelector('.tx');

      const dt=document.createElement('span'); dt.className='dt';
      dt.textContent=n.doneAt?new Date(n.doneAt).toLocaleDateString('fr-FR'):'';

      it.querySelector('.re').onclick=()=>{n.done=false;n.z=++state.z;save();renderAll();};

}

});
document.getElementById('gUp').onclick=()=>gateRun(async(mail,pass)=>{
  const {data,error}=await db.auth.signUp({email:mail,password:pass});
  if(error) throw error;
  if(!data.session) gateMsg('Compte créé. Confirme ton email, puis connecte-toi.',true);
});
gPass.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('gIn').click(); });

/* ---------- Démarrage ---------- */
let started=false;
async function start(u){
  user=u; started=true;
  try{
    await fetchBoards();
    if(!boards.length){                       // premier login : on remonte les post-its locaux
      const old=localBoards();
      if(old.length){ for(const o of old) await createBoard(o.name,o.state); }
      else await createBoard('Amira');
    }
  }catch(e){ started=false; gateMsg('Accès à la base impossible : '+frErr(e)); return; }
  let last=null; try{ last=localStorage.getItem(LASTKEY); }catch(e){}
  const b=boards.find(x=>x.name===last)||boards[0];
  boardId=b.id; profiles.current=b.name;
  state={...freshState(),...(b.state||{})};
  gate.classList.remove('on'); gateMsg(''); gPass.value='';
  loadView(); renderAll(); greet();
}
function stop(){
  started=false; user=null; boards=[]; boardId=null; profiles={list:[],current:''};
  noteEls.forEach(el=>el.remove()); noteEls.clear();
  state=freshState(); renderAll();
  gPass.value=''; gateMsg(''); gate.classList.add('on');
}
db.auth.onAuthStateChange((ev,session)=>{
  if(session&&session.user){ if(!started) start(session.user); }
  else if(started||ev==='SIGNED_OUT') stop();
});
</script>
</body>
</html>
